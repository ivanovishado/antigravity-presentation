<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 30pt;
  background: #ffffff; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
  box-sizing: border-box;
}
.header {
  font-size: 32pt; font-weight: bold; color: #202124;
  margin: 0 0 25pt 0; padding-bottom: 10pt;
  border-bottom: 3pt solid #FBBC04;
}
.content-area {
  flex: 1; display: flex; flex-direction: column; justify-content: center;
}
.content-area ul {
  margin: 0 0 20pt 0; padding-left: 25pt;
}
.content-area li {
  font-size: 18pt; color: #5F6368; margin-bottom: 12pt;
  line-height: 1.4;
}
.tip {
  background: #FEF7E0; border-left: 4pt solid #FBBC04;
  padding: 10pt 14pt; margin-top: 10pt;
}
.tip p {
  margin: 0; font-size: 16pt; color: #7D6608;
}
</style>
</head>
<body>
  <h1 class="header">Modelos y Cuotas</h1>
  <div class="content-area">
    <ul>
      <li><b>Modelos disponibles:</b> Gemini, Claude, GPT-4, y más</li>
      <li>Cuotas varían por modelo y uso</li>
      <li>Los modelos más potentes consumen más cuota</li>
    </ul>
    <div class="tip">
      <p><b>Tip:</b> Monitorea tu uso en la configuración de Antigravity</p>
    </div>
  </div>
</body>
</html>
