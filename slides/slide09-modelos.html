<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 35pt 30pt;
  background: #ffffff; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
  box-sizing: border-box;
}
.header {
  font-size: 30pt; font-weight: bold; color: #202124;
  margin: 0 0 6pt 0;
}
.header-line {
  width: 80pt; height: 3pt; background: #FBBC04;
  margin: 0 0 15pt 0;
}
.content-area {
  flex: 1; display: flex; flex-direction: column; justify-content: center;
}
.content-area ul {
  margin: 0 0 15pt 0; padding-left: 22pt;
}
.content-area li {
  font-size: 17pt; color: #5F6368; margin-bottom: 12pt;
  line-height: 1.35;
}
.tip {
  border-left: 4pt solid #FBBC04;
  padding: 8pt 12pt;
}
.tip p {
  margin: 0; font-size: 15pt; color: #5F6368;
}
</style>
</head>
<body>
  <h1 class="header">Modelos y Cuotas</h1>
  <div class="header-line"></div>
  <div class="content-area">
    <ul>
      <li><b>Modelos disponibles:</b> Gemini, Claude, GPT-4, y más</li>
      <li>Cuotas varían por modelo y uso</li>
      <li>Los modelos más potentes consumen más cuota</li>
    </ul>
    <div class="tip">
      <p><b>Tip:</b> Monitorea tu uso en la configuración de Antigravity</p>
    </div>
  </div>
</body>
</html>
