<!DOCTYPE html>
<html>
<head>
<style>
html { background: #F8F9FA; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 50pt;
  background: #F8F9FA; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  box-sizing: border-box;
}
.quote-container {
  max-width: 580pt; text-align: center;
}
.quote {
  font-size: 32pt; font-weight: bold; color: #202124;
  font-style: italic; margin: 0; line-height: 1.5;
}
.accent-bar {
  width: 80pt; height: 4pt; background: #4285F4;
  margin: 25pt auto 0 auto;
}
</style>
</head>
<body>
  <div class="quote-container">
    <p class="quote">"Now more than ever... you can just do things."</p>
    <div class="accent-bar"></div>
  </div>
</body>
</html>
