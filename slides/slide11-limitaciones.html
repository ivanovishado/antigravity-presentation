<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 35pt 30pt;
  background: #ffffff; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
  box-sizing: border-box;
}
.header {
  font-size: 28pt; font-weight: bold; color: #202124;
  margin: 0 0 6pt 0;
}
.header-line {
  width: 80pt; height: 3pt; background: #EA4335;
  margin: 0 0 15pt 0;
}
.content-area {
  flex: 1; display: flex; flex-direction: column; justify-content: center;
}
.limitation {
  display: flex; align-items: flex-start; margin-bottom: 14pt;
  border: 2pt solid #FBBC04; padding: 10pt 12pt; border-radius: 6pt;
}
.limitation p {
  margin: 0; font-size: 15pt; color: #5F6368; line-height: 1.35;
}
.note {
  margin-top: 15pt; padding: 8pt 12pt;
  border: 1pt solid #E8EAED; border-radius: 6pt;
}
.note p {
  margin: 0; font-size: 13pt; color: #5F6368; font-style: italic;
}
</style>
</head>
<body>
  <h1 class="header">Limitaciones Actuales</h1>
  <div class="header-line"></div>
  <div class="content-area">
    <div class="limitation">
      <p>El contexto usado <b>no es visible</b> al usuario</p>
    </div>
    <div class="limitation">
      <p>Posible compact de contexto sin transparencia</p>
    </div>
    <div class="limitation">
      <p>UX de agentes no es del todo clara</p>
    </div>
    <div class="note">
      <p>Estas son áreas de mejora continua — el producto sigue evolucionando</p>
    </div>
  </div>
</body>
</html>
