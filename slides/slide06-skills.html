<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 35pt 30pt;
  background: #ffffff; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
  box-sizing: border-box;
}
.header {
  font-size: 30pt; font-weight: bold; color: #202124;
  margin: 0 0 6pt 0;
}
.header-line {
  width: 60pt; height: 3pt; background: #34A853;
  margin: 0 0 12pt 0;
}
.content-row {
  display: flex; flex: 1; gap: 25pt;
}
.bullets {
  flex: 1.1; display: flex; flex-direction: column; justify-content: center;
}
.bullets ul {
  margin: 0; padding-left: 22pt;
}
.bullets li {
  font-size: 15pt; color: #5F6368; margin-bottom: 10pt;
  line-height: 1.35;
}
.tip-container {
  margin-top: 8pt;
}
.tip {
  border-left: 4pt solid #34A853;
  padding: 6pt 10pt;
}
.tip p {
  margin: 0; font-size: 13pt; color: #5F6368;
}
.placeholder {
  flex: 0.9; background: #E8EAED; border-radius: 8pt;
  display: flex; justify-content: center; align-items: center;
}
.placeholder p {
  font-size: 14pt; color: #9AA0A6; margin: 0;
}
</style>
</head>
<body>
  <h1 class="header">Skills</h1>
  <div class="header-line"></div>
  <div class="content-row">
    <div class="bullets">
      <ul>
        <li>Paquetes de conocimiento reutilizables</li>
        <li>Estructura: directorio con <b>SKILL.md</b> + scripts</li>
        <li>Se cargan solo cuando son relevantes</li>
        <li><b>Agent Browser Skill:</b> automatiza el navegador</li>
      </ul>
      <div class="tip-container">
        <div class="tip">
          <p><b>Tip:</b> Usa ASCII para iterar UI rápidamente</p>
        </div>
      </div>
    </div>
    <div id="gif-skills" class="placeholder">
      <p>[GIF: Skill en acción]</p>
    </div>
  </div>
</body>
</html>
