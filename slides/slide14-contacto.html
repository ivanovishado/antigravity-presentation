<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 30pt;
  background: #ffffff; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
  box-sizing: border-box;
}
.header {
  font-size: 36pt; font-weight: bold; color: #202124;
  text-align: center; margin: 0 0 30pt 0;
}
.qr-row {
  display: flex; flex: 1; justify-content: center; align-items: center; gap: 60pt;
}
.qr-item {
  display: flex; flex-direction: column; align-items: center;
}
.qr-placeholder {
  width: 140pt; height: 140pt; background: #E8EAED;
  border-radius: 8pt; display: flex; justify-content: center; align-items: center;
}
.qr-placeholder p {
  font-size: 14pt; color: #9AA0A6; margin: 0;
}
.qr-label {
  font-size: 18pt; color: #5F6368; margin: 12pt 0 0 0;
  font-weight: bold;
}
.thanks {
  font-size: 22pt; color: #34A853; text-align: center;
  margin: 25pt 0 0 0; font-weight: bold;
}
</style>
</head>
<body>
  <h1 class="header">¿Preguntas?</h1>
  <div class="qr-row">
    <div class="qr-item">
      <div id="qr-web" class="qr-placeholder">
        <p>[QR]</p>
      </div>
      <p class="qr-label">Mi Web</p>
    </div>
    <div class="qr-item">
      <div id="qr-linkedin" class="qr-placeholder">
        <p>[QR]</p>
      </div>
      <p class="qr-label">LinkedIn</p>
    </div>
  </div>
  <p class="thanks">¡Gracias por asistir!</p>
</body>
</html>
