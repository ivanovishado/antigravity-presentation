<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 35pt 30pt;
  background: #ffffff; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
  box-sizing: border-box;
}
.header {
  font-size: 28pt; font-weight: bold; color: #202124;
  margin: 0 0 6pt 0;
}
.header-line {
  width: 80pt; height: 3pt; background: #FBBC04;
  margin: 0 0 15pt 0;
}
.content-row {
  display: flex; flex: 1; gap: 25pt;
}
.bullets {
  flex: 1.1; display: flex; flex-direction: column; justify-content: center;
}
.bullets ul {
  margin: 0; padding-left: 22pt;
}
.bullets li {
  font-size: 15pt; color: #5F6368; margin-bottom: 10pt;
  line-height: 1.35;
}
.placeholder {
  flex: 0.9; background: #E8EAED; border-radius: 8pt;
  display: flex; justify-content: center; align-items: center;
}
.placeholder p {
  font-size: 14pt; color: #9AA0A6; margin: 0;
}
</style>
</head>
<body>
  <h1 class="header">Workflows: Comandos /slash</h1>
  <div class="header-line"></div>
  <div class="content-row">
    <div class="bullets">
      <ul>
        <li>Similares a slash commands en Claude</li>
        <li>Secuencias de pasos guardadas en markdown</li>
        <li>Se activan con <b>/nombre-del-workflow</b></li>
        <li>Pueden llamar a otros workflows</li>
        <li>Ubicación: <b>.agent/workflows/</b></li>
      </ul>
    </div>
    <div id="gif-workflow" class="placeholder">
      <p>[GIF: /workflow en acción]</p>
    </div>
  </div>
</body>
</html>
